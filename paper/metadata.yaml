abstract: "Este artículo analiza la resignificación de las redes sociales por parte de migrantes como canales de comunicación transnacional en Latinoamérica. Mediante una revisión sistemática de literatura (SLR) de 160 artículos indexados en Scopus (2019-2024) y un metaanálisis cualitativo, se identifican tres categorías fundamentales: conectividad, contexto de uso y divergencias. Los resultados demuestran que, frente a los usos lúdicos convencionales, las comunidades migrantes transforman estas plataformas en infraestructuras vitales para la copresencia virtual, el intercambio de capital social y la supervivencia económica. El estudio concluye que las redes sociales adquieren significados polisémicos que exceden su diseño original, constituyéndose en herramientas de resiliencia ante la precariedad institucional. Este marco analítico permite comprender la agencia del \"migrante conectado\" y ofrece bases para políticas públicas que reconozcan la centralidad de la infraestructura digital en los procesos de integración contemporáneos."
abstract_en: "This article analyzes how migrants resignify social media as channels for transnational communication. Through a systematic literature review of 160 Scopus-indexed articles (2019-2024) and qualitative meta-analysis, three analytical categories are identified: connectivity, context of use, and divergences. Results show that migrant communities transform these platforms into vital infrastructures for virtual co-presence, social capital exchange, and survival, diverging from conventional leisure-oriented uses. The study concludes that social media acquire polysemic meanings that exceed their original design, becoming resilience tools in contexts of institutional precariousness. This framework provides a theoretical basis for public policies that acknowledge digital infrastructure's role in contemporary migrant integration processes."
